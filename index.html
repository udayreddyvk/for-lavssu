<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d0d">

  <meta property="og:title" content="For Lavssu 🫶">
  <meta property="og:description" content="A little something from me to you.">

  <title>For Lavssu 🫶</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: #0d0d0d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d0d;
      color: #f1efec;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------- FIRST SCREEN ---------- */

    .hero {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      position: relative;
    }

    .hero-content {
      max-width: 650px;
      animation: appear 1.2s ease both;
    }

    .heart {
      font-size: 42px;
      margin-bottom: 26px;
      animation: float 3s ease-in-out infinite;
    }

    .main-message {
      font-size: clamp(30px, 7vw, 50px);
      line-height: 1.25;
      letter-spacing: -1px;
      font-weight: 500;
    }

    /* ---------- SCROLL HINT ---------- */

    .scroll-hint {
      position: absolute;
      bottom: 15vh;
      font-size: 13px;
      color: #aaa6a1;
      opacity: 0.72;
      letter-spacing: 0.5px;
      animation: hintPulse 2.2s ease-in-out infinite;
    }

    /* ---------- MESSAGE SECTION ---------- */

    .
